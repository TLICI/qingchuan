plugins { id 'com.android.application' }

// 发布签名从本机 keystore.properties 读取；该文件与 keystore 都不进仓库。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseSigning = keystorePropsFile.exists()

android {
    namespace 'com.qingchuan.connect'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.qingchuan.connect'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets { main.java.srcDir 'src/generated/java' }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint { abortOnError true }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation files('libs/bright_sdk.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

def verifyBrightSdk = tasks.register('verifyBrightSdk') {
    doLast {
        if (!file('libs/bright_sdk.aar').isFile() ||
            !file('src/generated/java/com/qingchuan/connect/SdkBinding.java').isFile()) {
            throw new GradleException('Real Bright SDK is missing. Run: python tools/build.py build (or import-sdk --aar PATH). No mock SDK is supplied.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn verifyBrightSdk }

